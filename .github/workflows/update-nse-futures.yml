name: Update NSE futures data

on:
  schedule:
    # 19:15 India time, Monday-Friday (UTC is 5 hours 30 minutes behind IST)
    - cron: '45 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nse-futures-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install downloader dependencies
        run: python -m pip install --upgrade requests beautifulsoup4
      - name: Download and validate latest NSE and GIFT Nifty files
        run: python update_nse_data.py
      - name: Commit refreshed market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_nse_fo_contract.csv.gz data/latest_nse_fo_bhavcopy.csv.zip data/nse_futures_data_status.json data/gift_nifty_history.csv
          if git diff --cached --quiet; then
            echo "NSE files unchanged; no commit needed."
          else
            git commit -m "chore: refresh NSE and GIFT Nifty market data"
            git push
          fi
